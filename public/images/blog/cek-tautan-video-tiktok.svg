<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi memeriksa tautan sebelum mengunduh</title><desc id="desc">Checklist untuk memastikan tautan utuh, video dapat diakses, dan browser tidak dibatasi aplikasi.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4efff"/><stop offset="1" stop-color="#e7f5ff"/></linearGradient></defs><rect width="1200" height="675" rx="34" fill="url(#bg)"/><rect x="58" y="46" width="176" height="38" rx="19" fill="#fff"/><text x="146" y="72" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#5b4ac8">ILUSTRASI</text><text x="62" y="145" font-family="Arial" font-size="38" font-weight="700" fill="#172033">Mulai dari tiga pemeriksaan dasar</text>
  <rect x="105" y="192" width="990" height="410" rx="28" fill="#fff"/><g font-family="Arial"><circle cx="192" cy="285" r="42" fill="#e9e5ff"/><path d="M175 284l12 12 23-26" fill="none" stroke="#6553d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="278" font-size="25" font-weight="700" fill="#24304a">Tautan tersalin lengkap</text><text x="265" y="313" font-size="18" fill="#667085">Salin ulang lewat Bagikan → Salin Tautan.</text>
  <path d="M151 357h898" stroke="#e8ebf3" stroke-width="2"/><circle cx="192" cy="427" r="42" fill="#e4f2ff"/><path d="M175 426l12 12 23-26" fill="none" stroke="#4f79d2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="420" font-size="25" font-weight="700" fill="#24304a">Video masih dapat dibuka</text><text x="265" y="455" font-size="18" fill="#667085">Cek apakah unggahan publik dan belum dihapus.</text>
  <path d="M151 499h898" stroke="#e8ebf3" stroke-width="2"/><circle cx="192" cy="548" r="35" fill="#e4f6ed"/><path d="M175 547l12 12 23-26" fill="none" stroke="#299a72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="557" font-size="25" font-weight="700" fill="#24304a">Gunakan browser penuh</text><text x="700" y="557" font-size="18" fill="#667085">Keluar dari browser dalam aplikasi bila perlu.</text></g>
</svg>
