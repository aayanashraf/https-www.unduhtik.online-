<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi menyimpan video dari aplikasi File ke Foto di iPhone</title><desc id="desc">Panduan konseptual membuka video di File, menggunakan menu Bagikan, lalu memilih Simpan Video.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1ecff"/><stop offset="1" stop-color="#e6f4ff"/></linearGradient></defs><rect width="1200" height="675" rx="34" fill="url(#bg)"/><rect x="58" y="46" width="176" height="38" rx="19" fill="#fff"/><text x="146" y="72" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#5b4ac8">ILUSTRASI</text><text x="62" y="145" font-family="Arial" font-size="38" font-weight="700" fill="#172033">Tiga langkah untuk melihat video di Foto</text>
  <g font-family="Arial"><rect x="87" y="218" width="308" height="335" rx="25" fill="#fff"/><circle cx="241" cy="286" r="38" fill="#eeeaff"/><path d="M226 275h30v24h-30z" fill="#7260d8"/><path d="M226 269h15l5 6h-20z" fill="#9487ed"/><text x="241" y="365" text-anchor="middle" font-size="24" font-weight="700" fill="#24304a">Buka File</text><text x="241" y="403" text-anchor="middle" font-size="17" fill="#667085">Cari folder Unduhan</text><text x="241" y="431" text-anchor="middle" font-size="17" fill="#667085">lalu buka videonya</text>
  <rect x="446" y="218" width="308" height="335" rx="25" fill="#fff"/><circle cx="600" cy="286" r="38" fill="#e6f2ff"/><path d="M600 262v43m-16-16 16 16 16-16" fill="none" stroke="#4f77d4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="365" text-anchor="middle" font-size="24" font-weight="700" fill="#24304a">Ketuk Bagikan</text><text x="600" y="403" text-anchor="middle" font-size="17" fill="#667085">Menu iOS bisa berbeda</text><text x="600" y="431" text-anchor="middle" font-size="17" fill="#667085">sesuai versi perangkat</text>
  <rect x="805" y="218" width="308" height="335" rx="25" fill="#fff"/><circle cx="959" cy="286" r="38" fill="#e5f7ed"/><path d="M944 286l11 11 22-24" fill="none" stroke="#2d9a70" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="959" y="365" text-anchor="middle" font-size="24" font-weight="700" fill="#24304a">Simpan Video</text><text x="959" y="403" text-anchor="middle" font-size="17" fill="#667085">Periksa aplikasi Foto</text><text x="959" y="431" text-anchor="middle" font-size="17" fill="#667085">setelah selesai</text></g>
  <path d="M395 384h43m-18-15 18 15-18 15M754 384h43m-18-15 18 15-18 15" fill="none" stroke="#7867df" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="606" text-anchor="middle" font-family="Arial" font-size="16" fill="#667085">Nama dan posisi menu dapat berubah menurut iOS</text>
</svg>
