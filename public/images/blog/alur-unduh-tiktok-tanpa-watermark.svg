  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2edff"/><stop offset="1" stop-color="#e5f2ff"/></linearGradient><linearGradient id="accent"><stop stop-color="#795bff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/><rect x="58" y="46" width="176" height="38" rx="19" fill="#fff"/><text x="146" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#5b4ac8">ILUSTRASI</text>
  <text x="62" y="145" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172033">Alur simpan video dari tautan</text>
