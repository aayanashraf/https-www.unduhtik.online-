<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi alur pemeriksaan saat unduhan gagal</title><desc id="desc">Diagram diagnosis sederhana dari mencoba ulang, memeriksa koneksi, hingga menghubungi dukungan.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f4ff"/><stop offset="1" stop-color="#f2edff"/></linearGradient></defs><rect width="1200" height="675" rx="34" fill="url(#bg)"/><rect x="58" y="46" width="176" height="38" rx="19" fill="#fff"/><text x="146" y="72" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#5b4ac8">ILUSTRASI</text><text x="62" y="145" font-family="Arial" font-size="38" font-weight="700" fill="#172033">Coba ulang dengan cara yang terukur</text>
  <g font-family="Arial"><rect x="83" y="226" width="260" height="254" rx="24" fill="#fff"/><circle cx="213" cy="291" r="34" fill="#eeeaff"/><text x="213" y="302" text-anchor="middle" font-size="26" font-weight="700" fill="#6856d8">1</text><text x="213" y="367" text-anchor="middle" font-size="23" font-weight="700" fill="#24304a">Salin ulang</text><text x="213" y="404" text-anchor="middle" font-size="17" fill="#667085">hapus teks ekstra</text><text x="213" y="432" text-anchor="middle" font-size="17" fill="#667085">dari tautan</text>
  <rect x="470" y="226" width="260" height="254" rx="24" fill="#fff"/><circle cx="600" cy="291" r="34" fill="#e4f2ff"/><text x="600" y="302" text-anchor="middle" font-size="26" font-weight="700" fill="#4e77d1">2</text><text x="600" y="367" text-anchor="middle" font-size="23" font-weight="700" fill="#24304a">Periksa koneksi</text><text x="600" y="404" text-anchor="middle" font-size="17" fill="#667085">muat ulang halaman</text><text x="600" y="432" text-anchor="middle" font-size="17" fill="#667085">dan tunggu sejenak</text>
  <rect x="857" y="226" width="260" height="254" rx="24" fill="#fff"/><circle cx="987" cy="291" r="34" fill="#e5f6ed"/><text x="987" y="302" text-anchor="middle" font-size="26" font-weight="700" fill="#299a72">3</text><text x="987" y="367" text-anchor="middle" font-size="23" font-weight="700" fill="#24304a">Coba tautan lain</text><text x="987" y="404" text-anchor="middle" font-size="17" fill="#667085">bila hanya satu video</text><text x="987" y="432" text-anchor="middle" font-size="17" fill="#667085">yang bermasalah</text></g>
  <path d="M353 354h94m-19-18 22 18-22 18M740 354h94m-19-18 22 18-22 18" fill="none" stroke="#7867df" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="557" text-anchor="middle" font-family="Arial" font-size="17" fill="#667085">Diagram panduan umum; bukan tangkapan layar pesan error asli</text>
</svg>
